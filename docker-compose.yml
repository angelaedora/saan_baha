services:
  noah:
    build:
      context: .
      dockerfile: jupyter.dockerfile
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    environment:
      - JUPYTER_TOKEN=noah
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - noah-network

  mongodb:
    build:
      context: .
      dockerfile: mongodb.dockerfile
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass123
    networks:
      - noah-network
    restart: unless-stopped

networks:
  noah-network:
    driver: bridge

volumes:
  mongodb_data: