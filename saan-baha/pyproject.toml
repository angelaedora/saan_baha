[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-flood-intelligence-system"
version = "0.1.0"
description = "Urban flood intelligence system with ML, RAG, and agentic analysis"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
