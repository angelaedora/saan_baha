version: "3.9"
services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://admin:pass123@mongodb:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-flood_intelligence}
    depends_on:
      - mongodb
    networks:
      - flood-network

  mongodb:
    build:
      context: ..
      dockerfile: deployment/mongodb.dockerfile
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-pass123}
    restart: unless-stopped
    networks:
      - flood-network

networks:
  flood-network:
    driver: bridge

volumes:
  mongodb_data:
